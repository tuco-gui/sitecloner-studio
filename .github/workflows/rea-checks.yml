name: SiteCloner checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/rea-integration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check worker/server.js && node --check lib/rea-bridge.js && node --check api/scrape.js
      - run: node --test test/*.test.js
